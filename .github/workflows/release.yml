name: Release

on:
  push:
    tags:
      - 'v*'

# Default to read-only permissions at the workflow level.
# Write access is granted only to the specific job that needs it (publish).
permissions:
  contents: read

jobs:
  build:
    name: Build production artifacts
    runs-on: ubuntu-latest
    # No write permissions needed here — just checkout and build.
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Archive production artifacts
        run: zip -r release.zip dist/

      - name: Upload build artifact for publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: release.zip
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Write permission is scoped only to this job that creates the GitHub Release.
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: release.zip
          generate_release_notes: true
